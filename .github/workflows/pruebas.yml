# Comprueba los cálculos de las herramientas cada vez que se sube un cambio.
# El resultado aparece en la pestaña "Actions" del repositorio (tick verde o cruz roja).
name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  calculos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/calculos.test.js
